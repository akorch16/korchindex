name: Scratch fetch
on:
  push:
    branches: [claude/fetch-tex-keel-scratch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scratch/fetch-close.mjs
      - run: |
          git config user.name "korch-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/scratch/closes.json
          git commit -m "scratch: closes result"
          git push

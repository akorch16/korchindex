name: Backfill FY25 picks' FY26-open price

# On-demand only -- run once. Fetches each FY25 pick's actual close on
# 2025-10-27 (the date FY26's own picks were priced from), for use as a
# same-date baseline in the FY26 page's Diamond hands comparison.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backfill-fy25-fy26open.mjs
      - id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "korch-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/year2.json
            git commit -m "chore: backfill FY25 picks' FY26-open price"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger the push-based deploy,
  # so redeploy explicitly when the backfill changed anything.
  deploy:
    needs: backfill
    if: needs.backfill.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml

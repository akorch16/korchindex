name: Scratch - test spotlight RSS summary

on:
  push:
    branches: [claude/korch-spotlight-summary]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-spotlight.mjs
      - run: cat public/live/spotlight.json

name: Diagnose KEEL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnose-keel.mjs
      - run: cat keel-diagnosis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keel-diagnosis
          path: keel-diagnosis.txt

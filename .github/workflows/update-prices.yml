name: Update live prices

on:
  schedule:
    # Hourly during/around US market hours, weekdays. 13-21 UTC covers
    # 9:30am-4pm ET in both EDT (UTC-4) and EST (UTC-5) with an hour of
    # padding on each side, so it doesn't need to change with DST.
    - cron: "0 13-21 * * 1-5"
    # Kept as a distinct final run shortly after the official close, so
    # the last snapshot of the day is the real closing price, not
    # whatever the 21:00 UTC intraday hourly run happened to catch.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs
      - id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "korch-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/live/prices.json
            git commit -m "chore: update live prices"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger the push-based deploy,
  # so redeploy explicitly when prices changed.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml

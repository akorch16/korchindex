name: Update live prices

on:
  schedule:
    # Twice an hour, not once, during/around US market hours, weekdays.
    # GitHub's scheduled-workflow queue is most congested right at the
    # top of the hour and can delay or silently drop triggers during
    # busy periods -- confirmed here: a single top-of-hour "0 13-21"
    # cron was only actually firing ~3x/day instead of the intended ~9,
    # with deliveries landing 15min-3hr late. Two offset slots per hour
    # gives redundancy so one dropped trigger doesn't leave an hours-
    # long gap, and the 21:xx pair doubles as the "shortly after close"
    # snapshot. 13-21 UTC covers 9:30am-4pm ET in both EDT and EST with
    # an hour of padding on each side, so it doesn't need to change
    # with DST.
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs
      - run: node scripts/update-spotlight.mjs
      - id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "korch-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/live/prices.json
            [ -f public/live/spotlight.json ] && git add public/live/spotlight.json
            git commit -m "chore: update live prices"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Pushes made with GITHUB_TOKEN don't trigger the push-based deploy,
  # so redeploy explicitly when prices changed.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
